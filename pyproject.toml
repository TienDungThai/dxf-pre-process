[project]
name = "dxf-cleaner"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.4,<2.0",
    "shapely>=2.0,<3.0",
    "numpy>=1.26",
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0",
    "click>=8.1",
    "Pillow>=10.0",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dxfclean = "dxf_cleaner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dxf_cleaner*"]
